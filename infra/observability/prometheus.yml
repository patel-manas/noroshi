global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "noroshi-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: "noroshi-api"
          environment: "local-dev"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
